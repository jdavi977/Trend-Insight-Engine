name: Weekly YouTube Pipeline

on:
  schedule:
    - cron: '0 8 * * 0,3,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-youtube
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          YOUTUBE_API: ${{ secrets.YOUTUBE_API }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAG_WRITE_ENABLED: ${{ secrets.RAG_WRITE_ENABLED }}
          RAG_READ_ENABLED: ${{ secrets.RAG_READ_ENABLED }}
        run: python -m ops.scripts.weeklyYoutube
